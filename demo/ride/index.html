<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K·A·M RIDE replica</title>
<meta name="description" content="Interactive web replica of the K·A·M RIDE Android bike computer, ported from its Kotlin/Compose source. Synthetic demo data only.">
<style>
/* Fonts shipped with the app (SIL OFL 1.1, licences alongside in fonts/). */
@font-face { font-family: "PS2P"; src: url("fonts/press_start_2p.ttf") format("truetype"); font-display: block; }
@font-face { font-family: "Silk"; src: url("fonts/silkscreen.ttf") format("truetype"); font-display: block; }
@font-face { font-family: "SilkB"; src: url("fonts/silkscreen_bold.ttf") format("truetype"); font-display: block; }

:root { --page: #0c0e13; --chrome: #1b1e26; --chip: #262a35; --chipInk: #c9cfdc; --dim: #7d8597; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); color: var(--chipInk); overflow: hidden; }
body { font-family: "Silk", ui-monospace, monospace; -webkit-font-smoothing: none; }

#wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 22px 8px 8px; }
#phone { position: relative; background: #050608; border-radius: 22px; box-shadow: 0 0 0 1px #2c303b, 0 10px 30px rgba(0,0,0,.55); flex: none; }
#phone::after { /* front camera dot, on the landscape left edge */
  content: ""; position: absolute; left: calc(var(--bz) * .45); top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #1d2230; }
#viewport { position: absolute; overflow: hidden; border-radius: 6px; }
#stage { position: absolute; left: 0; top: 0; width: 2992px; height: 1344px; transform-origin: 0 0; overflow: hidden; }

#bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: center; font-size: 11px; line-height: 1; max-width: 100%; flex: none; }
#bar .grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: center; }
#bar .lbl { color: var(--dim); margin-right: 2px; letter-spacing: .04em; }
#bar button { font: inherit; font-family: "Silk", monospace; font-size: 11px; color: var(--chipInk); background: var(--chip); border: 1px solid #353a48; border-radius: 4px; padding: 5px 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
#bar button[aria-pressed="true"] { border-color: var(--sel, #00d4ff); color: #fff; background: #10141c; }
#bar .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
#bar button:focus-visible, #stage button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#corner { position: fixed; right: 8px; top: 6px; font-family: "Silk", monospace; font-size: 10px; color: var(--dim); letter-spacing: .04em; pointer-events: none; z-index: 5; }

/* ---- inside the device: every number below is a physical-pixel value from the Kotlin source ---- */
.t { white-space: pre; display: block; flex: none; }
.ps { font-family: "PS2P", monospace; }
.sk { font-family: "Silk", monospace; }
.sb { font-family: "SilkB", monospace; }
.col { display: flex; flex-direction: column; }
.row { display: flex; flex-direction: row; }
.ctr { align-items: center; }
.sp { flex: 1 1 0; min-height: 0; min-width: 0; }
img.art { display: block; image-rendering: crisp-edges; image-rendering: pixelated; flex: none; }
#stage button.btn { all: unset; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.buddy { cursor: pointer; flex: none; display: flex; align-items: flex-end; }
.scan::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 9;
  background: repeating-linear-gradient(to bottom, var(--scan) 0 3px, transparent 3px 8px); }
.layer { position: absolute; inset: 8px; pointer-events: none; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="corner">replica · demo data</div>
<div id="wrap">
  <div id="phone"><div id="viewport"><div id="stage" aria-live="off"></div></div></div>
  <div id="bar" role="toolbar" aria-label="Replica controls">
    <div class="grp" id="gTheme"><span class="lbl">THEME</span></div>
    <div class="grp" id="gBuddy"><span class="lbl">BUDDY</span></div>
    <div class="grp" id="gMore"></div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================================
 * K·A·M RIDE — web replica. Ported from the app's Kotlin source:
 *   Themes.kt (THEMES), Pixel.kt (Px, BIKE, PixelProfile, Scanlines, hms, BURN_IN_OFFSETS),
 *   GameUi.kt (Companion, CoinCounter, BattlePanel, RoadScene, bossArt, COIN/COIN_SPIN, RIDER,
 *   PopupHost cards), game/Buddy.kt (SPECIES, BUDDY_COLOURS, frames), game/Game.kt (Rules, boss
 *   spawn/HP/escape, NAMES), game/FastRun.kt (turbo threshold), Screens.kt (TitleScreen, FLAME,
 *   petFrames, SayBubble, MissionStrip, NextMissions), RideActivity.kt (RideScreen, Field, Button,
 *   Summary). Ride data is synthetic: a looping made-up course, no GPS, no maps, no places.
 * ===================================================================================== */

const W = 2992, H = 1344;            // landscape phone, physical px
const SIM = 6;                       // demo time compression (the app's showcase runs x25)

// ---- Themes.kt -----------------------------------------------------------------------
const THEMES = [
  { id: "kam",  name: "K·A·M TERMINAL", bezel: "#0B1830", bezelInk: "#00D4FF", screen: "#04080F", ink: "#00D4FF", ink2: "#00FF88", label: "#4A6888", accent: "#AA66FF" },
  { id: "ride", name: "RIDE",           bezel: "#000000", bezelInk: "#FFFF00", screen: "#000000", ink: "#FFFFFF", ink2: "#FFFF00", label: "#FFFF00", accent: "#FFFF00" },
  { id: "nes",  name: "NES",            bezel: "#7C7C7C", bezelInk: "#000000", screen: "#000000", ink: "#FCFCFC", ink2: "#BCBCBC", label: "#F83800", accent: "#FCA044" },
  { id: "vboy", name: "VIRTUAL BOY",    bezel: "#1A0000", bezelInk: "#E00000", screen: "#000000", ink: "#FF1A1A", ink2: "#B00000", label: "#800000", accent: "#FF5050" },
];
const DIGIT_SCALES = [32, 40, 48];

// ---- game/Buddy.kt -------------------------------------------------------------------
const SPECIES = [
  { id: "bit", root: "BIT", frame: ["....XXXX....", "..XXXXXXXX..", ".XXXXXXXXXX.", ".XX..XX..XX.", ".XX..XX..XX.", ".XXXXXXXXXX.", ".XXXX..XXXX.", "..XXXXXXXX..", "...XXXXXX...", "..X......X..", ".X........X."], legs2: "...X....X..." },
  { id: "bot", root: "BOT", frame: [".....X......", "..XXXXXXXX..", "..XXXXXXXX..", "..X..XX..X..", "..X..XX..X..", "..XXXXXXXX..", "..XX.X.X.XX.", "XXXXXXXXXXXX", "..XXXXXXXX..", "..XX....XX..", "..XX....XX.."], legs2: "...XX..XX..." },
  { id: "pip", root: "PIP", frame: ["....XXXX....", "...XXXXXX...", "..XXXXXXXX..", "..XX.XX.XXX.", "..XXXXXXXXXX", "..XXXXXXXXX.", ".XXXXXXXXX..", "XXXXXXXXXX..", "..XXXXXXX...", "...X...X....", "..XX..XX...."], legs2: "...XX..XX..." },
  { id: "kit", root: "KIT", frame: [".X........X.", ".XX......XX.", ".XXXXXXXXXX.", ".XX.XXXX.XX.", ".XXXXXXXXXX.", "..XXX..XXX..", "...XXXXXX...", "..XXXXXXXX.X", "..XXXXXXXXX.", "..X.X..X.X..", "..X......X.."], legs2: "...X....X..." },
  { id: "goo", root: "GOO", frame: ["............", "....XXXX....", "..XXXXXXXX..", ".XXX.XX.XXX.", ".XXX.XX.XXX.", "XXXXXXXXXXXX", "XXXX....XXXX", "XXXXXXXXXXXX", "XXXXXXXXXXXX", "X.XX.XX.XX.X", "X..X.XX.X..X"], legs2: ".X.XX..XX.X." },
];
const BUDDY_COLOURS = [["THEME", 0], ["MINT", 0x00FF88], ["SKY", 0x44AAFF], ["VIOLET", 0xAA66FF], ["ROSE", 0xFF66CC], ["SUN", 0xFFCC00], ["FLAME", 0xFF7700], ["LIME", 0xB0FF40], ["SNOW", 0xF0F0F0]];

/** Screens.kt petFrames() for a BABY with no gear: frame 0, and frame 1 bobbed down a row. */
function petFrames(id) {
  const s = SPECIES.find(x => x.id === id) || SPECIES[0];
  const frames = [s.frame, ["............", ...s.frame.slice(0, 9), s.legs2]];
  return frames.map(f => {
    const bob = /^\.*$/.test(f[0]);
    const rows = bob ? f.slice(1) : f.slice();
    const w = Math.max(...rows.map(r => r.length));
    const dressed = rows.map(r => r.padEnd(w, "."));
    return bob ? [".".repeat(w), ...dressed] : [...dressed, ".".repeat(w)];
  });
}

// ---- GameUi.kt sprites ---------------------------------------------------------------
const COIN = ["..XXXX..", ".X....X.", "X..XX..X", "X..XX..X", "X..XX..X", "X..XX..X", ".X....X.", "..XXXX.."];
const COIN_SPIN = [COIN,
  ["...XX...", "..X..X..", "..X.XX..", "..X.XX..", "..X.XX..", "..X.XX..", "..X..X..", "...XX..."],
  ["...XX...", "...XX...", "...XX...", "...XX...", "...XX...", "...XX...", "...XX...", "...XX..."],
  ["...XX...", "..X..X..", "..XX.X..", "..XX.X..", "..XX.X..", "..XX.X..", "..X..X..", "...XX..."]];
const FLAME = ["...X....", "..XX..X.", ".XXX.XX.", ".XXXXXX.", "XXXXXXXX", "XXX..XXX", ".XX..XX.", "..XXXX.."];
const SHOT = [".XX.", "XXXX", "XXXX", ".XX."];
const RIDER = ["....XXXX....", "...XXXXXX...", "....XXXX....", "..XXXXXXXX..", ".XX.XXXX.XX.", "XX..XXXX..XX", "....XXXX....", "....X..X....", "...XX..XX...", "...X....X...", "..XXX..XXX..", "..XXX..XXX.."];
const GOLEM = ["...XXXXXXXX...", "..XX..XX..XX..", "..XXXXXXXXXX..", "XXXX.XXXX.XXXX", "XX.XXXXXXXX.XX", "XX.XX....XX.XX", "...XXXXXXXX...", "...XXX..XXX...", "..XXXX..XXXX..", "..XXX....XXX.."];
const DRAKE = ["X...........XX", "XX.......XXXX.", ".XXX...XXX.XX.", "..XXXXXXXXXXXX", "...XXXXXXXX...", "..XXXXXXXXXX..", ".XX.XXXXXX.XX.", "XX..XX..XX..XX", "....XX..XX....", "...XXX..XXX..."];
const KING = ["X..X..XX..X..X", "XXXXXXXXXXXXXX", ".XXXXXXXXXXXX.", ".XX..XXXX..XX.", ".XX..XXXX..XX.", ".XXXXXXXXXXXX.", ".XXX......XXX.", "..XXXXXXXXXX..", ".XX.XXXXXX.XX.", "XX..XX..XX..XX"];
const SLIME = ["....XXXXXX....", "..XXXXXXXXXX..", ".XXXXXXXXXXXX.", ".XX..XXXX..XX.", "XXX..XXXX..XXX", "XXXXXXXXXXXXXX", "XXXX.XXXX.XXXX", "XXXXX....XXXXX", ".XXXXXXXXXXXX.", "X.X.X.X.X.X.X."];
const bossArt = n => n.includes("GOLEM") ? GOLEM : n.includes("DRAKE") ? DRAKE : n.includes("KING") ? KING : SLIME;
const BUDDY_TAP_LINES = ["LET'S RIDE!", "WHEEEE!", "DIG DEEP!", "TOO EASY!", "LOVELY ROLLING", "HOLD ON TIGHT!"];
const NAMES = ["HILL SLIME", "RIDGE GOLEM", "SLOPE DRAKE", "SUMMIT KING"];   // game/Game.kt

// ---- Rules (game/Game.kt) ------------------------------------------------------------
const xpFor = l => 50 * l * (l - 1);
const levelFor = xp => Math.min(99, Math.max(1, Math.floor((1 + Math.sqrt(1 + 8 * xp / 100)) / 2)));
const SPAWN_GRADE = 2.5, SPAWN_RUN_M = 100, GPS_ONLY_SPAWN = 5, ESCAPE_GRADE = 1, ESCAPE_RUN_M = 250, QUIET_M = 300, FREE_RIDE_MAX_HP = 14, BOSS_COINS = 5;
// FastRun.kt
const FR_MIN = 18, FR_FACTOR = 1.2, FR_ENTER = 5000, FR_EXIT = 5000, FR_MAX_GRADE = 2;

// ---- Demo profile (synthetic) --------------------------------------------------------
const PROFILE = { xp: 220, coins: 38, streak: 3, baselineKmh: 25 };
const MISSIONS = [{ kind: "KM", title: "RIDE 7 KM", target: 7, reward: 15 }, { kind: "TURBO", title: "TURBO FOR 60S", target: 60, reward: 10 }, { kind: "CLIMB", title: "CLIMB 40 M", target: 40, reward: 15 }];
const DAILY = [["COIN FRENZY", "ROUTE COINS x2"], ["BOSS RUSH", "BOSS COINS x2"], ["MISSION DAY", "MISSION COINS x2"], ["XP BOOST", "XP x1.25"], ["LUCKY EGGS", "UP TO 3 EGGS HATCH"], ["BONUS DAY", "GAMES, CHESTS + QUESTS PAY x2"], ["STREAK SUNDAY", "DAILY BONUS x3"]];

// ---- helpers -------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hex2 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (h, a) => { const [r, g, b] = hex2(h); return `rgba(${r},${g},${b},${a})`; };
function lerpColor(a, b, f) { const A = hex2(a), B = hex2(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * f)).join(",")})`; }
const f1 = v => v.toFixed(1), f2 = v => v.toFixed(2);
const pad = (s, n) => String(s).padStart(n, " ");
function hms(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function formatGrade(g) { if (g == null) return "--"; if (Math.abs(g) < 0.5) return "0%"; return g > 0 ? `+${Math.max(1, Math.trunc(g))}%` : `${Math.min(-1, Math.trunc(g))}%`; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/** Px(): pixel-font text sized in physical pixels, lineHeight = size. */
function Px(text, size, color, fam = "ps", extra = "") {
  return `<div class="t ${fam}" style="font-size:${size}px;line-height:${size}px;color:${color};${extra}">${esc(text)}</div>`;
}
const gapV = n => `<div style="height:${n}px;flex:none"></div>`;
const gapH = n => `<div style="width:${n}px;flex:none"></div>`;

/** PixelArt(): one canvas pixel per sprite cell, scaled up with nearest-neighbour. */
const artCache = new Map();
function artURL(rows, color) {
  const key = color + "|" + rows.join("/");
  let u = artCache.get(key);
  if (!u) {
    const w = Math.max(...rows.map(r => r.length)), h = rows.length;
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.fillStyle = color;
    rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === "X") g.fillRect(x, y, 1, 1); });
    u = c.toDataURL(); artCache.set(key, u);
  }
  return u;
}
function Art(rows, color, p, attrs = "") {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  return `<img class="art" alt="" ${attrs} src="${artURL(rows, color)}" style="width:${w * p}px;height:${h * p}px">`;
}
function setArt(img, rows, color, p) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  img.src = artURL(rows, color); img.style.width = w * p + "px"; img.style.height = h * p + "px";
}

// ---- reduced motion ------------------------------------------------------------------
const mq = matchMedia("(prefers-reduced-motion: reduce)");
let RM = mq.matches;
mq.addEventListener ? mq.addEventListener("change", e => { RM = e.matches; }) : mq.addListener(e => { RM = e.matches; });

// ---- state ---------------------------------------------------------------------------
const UI = { screen: "title", theme: 0, species: "bit", tint: 0, sizeIx: 1, voice: true, crt: false, scale: 1 };
let R;   // ride stats + game hud
function freshRide() {
  return {
    state: "IDLE", speed: null, dist: 0, moving: 0, elapsed: 0, alt: 92, ascent: 0, grade: null, maxKmh: 0,
    profile: [], nextProfileAt: 0, simT: 0,
    // game
    coins: 0, bonus: 0, boss: null, beaten: 0, climbRun: 0, flatRun: 0, spawnAscent: 0, quietUntil: 0,
    // fast run
    fast: false, aboveSince: null, belowSince: null, turboSec: 0, turnRate: 0,
  };
}
R = freshRide();
const T = () => THEMES[UI.theme];
const sp = () => SPECIES.find(s => s.id === UI.species) || SPECIES[0];
const body = () => UI.tint ? "#" + UI.tint.toString(16).padStart(6, "0").toUpperCase() : T().accent;
const live = () => R.state !== "IDLE";

// ---- Companion (GameUi.kt) -----------------------------------------------------------
let buddyFrame = 0, say = null, sayTimer = 0;
function Companion(p) { return `<div class="buddy" role="button" tabindex="0" aria-label="Tap your buddy" data-p="${p}"><img class="art" alt=""></div>`; }
function drawBuddies() {
  const frames = petFrames(UI.species), f = frames[(RM ? 0 : buddyFrame) % frames.length], c = body();
  document.querySelectorAll("#stage .buddy").forEach(el => setArt(el.firstChild, f, c, +el.dataset.p));
}
(function buddyLoop() {
  const v = UI.screen === "ride" && (R.state === "RECORDING") ? (R.speed || 0) : 0;
  const d = v < 2 ? 700 : clamp(Math.round(1400 / v), 90, 450);
  setTimeout(() => { buddyFrame = 1 - buddyFrame; if (!RM) drawBuddies(); buddyLoop(); }, d);
})();
function tapBuddy(el) {
  const p = +el.dataset.p;
  if (!RM) { el.style.transform = `translateY(${-p * 5}px)`; setTimeout(() => { el.style.transform = ""; }, 350); }
  say = BUDDY_TAP_LINES[Math.floor(Math.random() * BUDDY_TAP_LINES.length)];
  clearTimeout(sayTimer); sayTimer = setTimeout(() => { say = null; renderSay(); }, 3350);
  renderSay();
}
function SayBubble(text) {
  const t = T();
  return `<div class="row ctr" style="align-self:flex-start;background:${t.screen};box-shadow:inset 0 0 0 5px ${t.ink2};padding:12px 22px">${Px(sp().root + ": ", 30, t.label, "sb")}${Px(text, 34, t.ink2, "sb")}</div>`;
}
function renderSay() { const el = $("say"); if (el) el.innerHTML = say ? SayBubble(say) + gapV(12) : ""; }

// ---- Button (RideActivity.kt) --------------------------------------------------------
function Btn(text, act, size, ink) {
  const t = T();
  const sz = size === "w" ? "flex:1 1 0;min-height:0" : `height:${size}px;flex:none`;
  return `<button class="btn" data-act="${act}" style="${sz};width:100%;background:${t.screen};box-shadow:inset 0 0 0 8px ${t.label}">${text.split("\n").map(l => Px(l, 48, ink || t.ink, "sb")).join("")}</button>`;
}

// ---- Title screen (Screens.kt TitleScreen) -------------------------------------------
let titleBlink = true, titleBob = 0;
function renderTitle() {
  const t = T(), lvl = levelFor(PROFILE.xp), from = xpFor(lvl), to = xpFor(lvl + 1);
  const f = clamp((PROFILE.xp - from) / (to - from), 0, 1);
  const now = new Date(), day = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  const today = DAILY[(((day + 3) % 7) + 7) % 7];
  $("stage").innerHTML = `
  <div style="position:absolute;inset:0;background:${t.bezel};padding:32px;display:flex;gap:32px">
    <div id="tbox" class="${UI.crt ? "scan" : ""}" style="--scan:${rgba(t.screen, .35)};position:relative;flex:1 1 0;background:${t.screen};box-shadow:inset 0 0 0 8px ${rgba(t.bezelInk, .35)};display:flex;align-items:center;justify-content:center">
      <div class="col ctr">
        ${Px("K·A·M", 192, t.ink)}
        ${gapV(24)}
        ${Px("R I D E", 96, t.accent)}
        ${gapV(48)}
        <div id="tbob" style="height:${12 * 16}px;display:flex;align-items:flex-end">${Companion(16)}</div>
        ${gapV(16)}
        ${Px(`${sp().root} · BABY`, 32, t.label, "sb")}
        ${gapV(40)}
        <div id="pressStart">${Px("PRESS START", 64, t.ink2)}</div>
        ${gapV(24)}
        <button class="btn" data-act="showcase" style="box-shadow:inset 0 0 0 6px ${t.accent};padding:18px 36px">${Px("▶ SHOWCASE RIDE", 40, t.accent)}</button>
        ${gapV(20)}
        ${Px(`TODAY: ${today[0]} · ${today[1]}`, 32, t.accent, "sb")}
        ${gapV(48)}
        <div class="row ctr">
          ${Px(`LV ${lvl}`, 40, t.label, "sb")}${gapH(24)}
          <div style="width:420px;height:32px;box-shadow:inset 0 0 0 4px ${t.label};padding:8px;flex:none"><div style="height:100%;width:${Math.trunc((420 - 16) * f)}px;background:${t.ink2}"></div></div>
          ${gapH(32)}${Art(COIN, t.accent, 5)}${gapH(12)}${Px(`${PROFILE.coins}`, 40, t.label, "sb")}
          ${gapH(32)}${Art(FLAME, PROFILE.streak > 0 ? t.accent : t.label, 5)}${gapH(12)}${Px(`STREAK ${PROFILE.streak}`, 40, t.label, "sb")}
        </div>
      </div>
      <div id="hint" class="layer"></div>
    </div>
    <div class="col" style="width:380px;flex:none;gap:28px">
      ${Btn("START", "start", "w")}
      ${Btn(sp().root, "buddy", 106)}
      ${Btn("SHOP", "na:SHOP", 106)}
      ${Btn("DEX", "na:DEX", 106)}
      ${Btn("WORLD", "na:WORLD", 106)}
      ${Btn("BADGES", "na:BADGES", 106)}
      ${Btn("CODEX", "na:CODEX", 106)}
      ${Btn(UI.voice ? "VOICE: ON" : "VOICE: OFF", "voice", 100)}
    </div>
  </div>`;
  drawBuddies(); titleTick();
}
function titleTick() {
  const ps = $("pressStart"); if (ps) ps.style.visibility = titleBlink ? "visible" : "hidden";
  const b = document.querySelector("#tbob .buddy"); if (b) b.style.marginBottom = (!RM && titleBob === 1) ? "12px" : "0";
}
setInterval(() => { titleBlink = !titleBlink; titleBob = (titleBob + 1) % 2; if (UI.screen === "title") titleTick(); }, 500);

// ---- Ride screen (RideActivity.kt RideScreen) ----------------------------------------
let lowerKind = null, rideBlink = true, burnMinute = 0;
const BURN = [[0, 0], [4, 0], [4, 4], [0, 4], [-4, 4], [-4, 0], [-4, -4], [0, -4]];
function Field(label, id) { const t = T(); return `<div class="col">${Px(label, 32, t.label, "sk")}${gapV(16)}<div id="${id}">${Px("--", 80, t.ink)}</div></div>`; }
function renderRide() {
  const t = T();
  $("stage").innerHTML = `
  <div style="position:absolute;inset:0;background:${t.bezel}">
   <div id="burn" class="col" style="position:absolute;inset:0">
    <div class="row" style="height:136px;flex:none;padding:40px 56px;align-items:flex-end;justify-content:space-between">
      ${Px("K·A·M RIDE", 48, t.bezelInk, "sb")}
      <div id="hStatus"></div><div id="hGps"></div><div id="hClock"></div>
    </div>

  const target = c.v + 1.4 * Math.sin(R.simT * 0.21) + 0.8 * Math.sin(R.simT * 0.77);
  R.speed = R.speed == null ? 8 : R.speed + (target - R.speed) * Math.min(1, dt * 0.22);
  R.maxKmh = Math.max(R.maxKmh, R.speed);
  const step = R.speed / 3.6 * dt;
  R.dist += step; R.moving += dt * 1000;
  const gNow = c.g + 0.35 * Math.sin(R.simT * 0.5);
  R.grade = R.grade == null ? gNow : R.grade + (gNow - R.grade) * Math.min(1, dt * 0.3);
  const dAlt = R.grade / 100 * step;
  R.alt += dAlt; if (dAlt > 0) R.ascent += dAlt;
  if (R.dist >= R.nextProfileAt) { R.profile.push(R.alt); if (R.profile.length > 60) R.profile.shift(); R.nextProfileAt = R.dist + 50; }
  R.turnRate = c.bend;
  // GameEngine.update (game/Game.kt), free-ride mode
  const coins = Math.floor(R.dist / 1000);
  if (coins > R.coins) { R.coins = coins; emit({ type: "coin", gained: 1, total: R.coins + R.bonus }); }
  if (!R.boss) {
    R.climbRun = R.grade >= SPAWN_GRADE ? R.climbRun + step : 0;
    if (R.climbRun >= SPAWN_RUN_M && R.grade >= GPS_ONLY_SPAWN && R.dist >= R.quietUntil) {
      const lvl = Math.min(9, 1 + Math.floor(levelFor(PROFILE.xp) / 3) + R.beaten);
      const hp = Math.min(10 + 4 * lvl, FREE_RIDE_MAX_HP);
      R.boss = { name: `${NAMES[Math.min(lvl - 1, NAMES.length - 1)]} LV${lvl}`, level: lvl, hpMax: hp, hp };
      R.spawnAscent = R.ascent; R.flatRun = 0;
      emit({ type: "spawn", name: R.boss.name });
    }
  } else {
    R.boss.hp = Math.max(0, R.boss.hpMax - (R.ascent - R.spawnAscent));
    if (R.boss.hp <= 0) {
      const reward = BOSS_COINS * R.boss.level;
      emit({ type: "ko", name: R.boss.name, coins: reward });
      R.beaten++; R.bonus += reward; R.boss = null; R.climbRun = 0; R.quietUntil = R.dist + QUIET_M;
    } else {
      R.flatRun = R.grade < ESCAPE_GRADE ? R.flatRun + step : 0;
      if (R.flatRun >= ESCAPE_RUN_M) { emit({ type: "escaped" }); R.boss = null; R.climbRun = 0; R.quietUntil = R.dist + QUIET_M; }
    }
  }
  // FastRun (game/FastRun.kt), timed in demo seconds
  const now = R.simT * 1000, thr = Math.max(FR_MIN, PROFILE.baselineKmh * FR_FACTOR), flat = R.grade <= FR_MAX_GRADE;
  if (!R.fast) {
    if (R.speed >= thr && flat) { if (R.aboveSince == null) R.aboveSince = now; if (now - R.aboveSince >= FR_ENTER) { R.fast = true; R.belowSince = null; emit({ type: "turbo", over: Math.trunc(thr) }); } }
    else R.aboveSince = null;
  } else {
    R.turboSec += dt;
    if (R.speed < thr * 0.9 || !flat) { if (R.belowSince == null) R.belowSince = now; if (now - R.belowSince >= FR_EXIT) { R.fast = false; R.aboveSince = null; } }
    else R.belowSince = null;
  }
}

let lastT = performance.now(), uiAcc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  simStep(dt);
  if (UI.screen === "ride") {
    uiAcc += dt;
    if (uiAcc > 0.1) { uiAcc = 0; rideTick(); }
    if (lowerKind === "road") drawRoad(dt);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- actions -------------------------------------------------------------------------
function go(screen) { UI.screen = screen; queue.length = 0; popGen++; (screen === "title" ? renderTitle : renderRide)(); }
function startRide() { R = freshRide(); R.state = "RECORDING"; R.speed = 0; renderControls(); rideTick(true); }
const act = {
  start: () => go("ride"),
  showcase: () => { go("ride"); startRide(); },
  buddy: () => setSpecies(SPECIES[(SPECIES.indexOf(sp()) + 1) % SPECIES.length].id),
  voice: () => { UI.voice = !UI.voice; renderTitle(); },
  go: startRide,
  menu: () => go("title"),
  pause: () => { R.state = "PAUSED"; R.speed = 0; renderControls(); rideTick(true); },
  resume: () => { R.state = "RECORDING"; renderControls(); rideTick(true); },
  stop: () => hint("HOLD 2 SEC TO STOP"),
  newride: () => { R = freshRide(); renderData(); renderControls(); rideTick(true); },
  theme: () => { setTheme((UI.theme + 1) % THEMES.length); hint(T().name); },
  size: () => { UI.sizeIx = (UI.sizeIx + 1) % 3; rideTick(); },
};
function doAct(name) {
  if (name.startsWith("na:")) { hint(`${name.slice(3)} · NOT IN REPLICA`); return; }
  (act[name] || (() => {}))();
}
const stage = $("stage");
stage.addEventListener("click", e => {
  const bud = e.target.closest(".buddy"); if (bud) { tapBuddy(bud); return; }
  const b = e.target.closest("button[data-act]"); if (!b || b.dataset.act === "stop") return;
  doAct(b.dataset.act);
});
stage.addEventListener("keydown", e => {
  const bud = e.target.closest && e.target.closest(".buddy");
  if (bud && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tapBuddy(bud); }
});
// HOLD STOP: a deliberate 2 s press ends the ride; a shorter press is a tap.
let holdTimer = 0, held = false;
function holdStart(e) {
  const b = e.target.closest && e.target.closest('button[data-act="stop"]'); if (!b) return;
  if (e.type === "keydown") { if (e.repeat || (e.key !== "Enter" && e.key !== " ")) return; e.preventDefault(); }
  held = false; clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { held = true; R.state = "FINISHED"; R.boss = null; R.fast = false; queue.length = 0; popGen++; const p = $("popup"); if (p) p.innerHTML = ""; renderData(); renderControls(); rideTick(true); }, 2000);
}
function holdEnd(e) {
  const b = e.target.closest && e.target.closest('button[data-act="stop"]'); if (!b) return;
  if (e.type === "keyup" && e.key !== "Enter" && e.key !== " ") return;
  clearTimeout(holdTimer); if (!held) act.stop();
}
stage.addEventListener("pointerdown", holdStart); stage.addEventListener("keydown", holdStart);
stage.addEventListener("pointerup", holdEnd); stage.addEventListener("keyup", holdEnd);
stage.addEventListener("pointerleave", () => clearTimeout(holdTimer), true);

function rerender() { (UI.screen === "title" ? renderTitle : renderRide)(); syncBar(); }
function setTheme(i) { UI.theme = i; profKey = ""; rerender(); }
function setSpecies(id) { UI.species = id; rerender(); }

// ---- toolbar outside the device ------------------------------------------------------
function buildBar() {
  $("gTheme").insertAdjacentHTML("beforeend", THEMES.map((t, i) => `<button data-theme="${i}" style="--sel:${t.bezelInk === "#000000" ? t.accent : t.bezelInk}"><span class="sw" style="background:${t.accent};box-shadow:0 0 0 2px ${t.bezel}"></span>${t.id.toUpperCase()}</button>`).join(""));
  $("gBuddy").insertAdjacentHTML("beforeend", SPECIES.map(s => `<button data-sp="${s.id}">${s.root}</button>`).join(""));
  $("gMore").innerHTML = `<button id="bColour">COLOUR <span class="sw" id="cSw"></span><span id="cName"></span></button><button id="bCrt" aria-pressed="false">SCANLINES</button>`;
  $("bar").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.theme) setTheme(+b.dataset.theme);
    else if (b.dataset.sp) setSpecies(b.dataset.sp);
    else if (b.id === "bColour") { const i = BUDDY_COLOURS.findIndex(c => c[1] === UI.tint); UI.tint = BUDDY_COLOURS[(i + 1) % BUDDY_COLOURS.length][1]; rerender(); }
    else if (b.id === "bCrt") { UI.crt = !UI.crt; rerender(); }
  });
  syncBar();
}
function syncBar() {
  document.querySelectorAll("#bar [data-theme]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.theme === UI.theme));
  document.querySelectorAll("#bar [data-sp]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sp === UI.species));
  const c = BUDDY_COLOURS.find(c => c[1] === UI.tint) || BUDDY_COLOURS[0];
  $("cSw").style.background = body(); $("cName").textContent = c[0];
  $("bCrt").setAttribute("aria-pressed", UI.crt);
}

// ---- fit the 2992×1344 device into whatever box the iframe gives us ------------------
function fit() {
  const bar = $("bar"), vw = innerWidth, vh = innerHeight;
  bar.style.maxWidth = (vw - 16) + "px";
  const barH = bar.offsetHeight + 8;
  const availW = vw - 16, availH = vh - 30 - barH;
  let s = Math.min(availW / (W * 1.04), availH / (H * 1.09));
  s = Math.max(0.05, s);
  const sw = W * s, sh = H * s, bz = Math.max(6, Math.round(sh * 0.045)), bzx = Math.max(10, Math.round(sw * 0.02));
  const ph = $("phone"); ph.style.width = (sw + bzx * 2) + "px"; ph.style.height = (sh + bz * 2) + "px";
  ph.style.borderRadius = Math.max(10, bz * 2) + "px"; ph.style.setProperty("--bz", bzx + "px");
  const vp = $("viewport"); Object.assign(vp.style, { left: bzx + "px", top: bz + "px", width: sw + "px", height: sh + "px" });
  $("stage").style.transform = `scale(${s})`;
  const changed = s !== UI.scale; UI.scale = s;
  if (changed) { profKey = ""; drawProfile(true); }
}
addEventListener("resize", fit);

buildBar();
renderTitle();
fit();
document.fonts && document.fonts.ready.then(fit);
// test/debug hook: jump the synthetic course forward (demo metres)
window.kamride = { skip(m) { for (let i = 0; i < m; i += 2) { const v = (R.speed || 20) / 3.6; simStep(Math.min(0.1, 2 / v / SIM)); } }, R: () => R };
</script>
