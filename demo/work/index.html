<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>W·O·R·K replica</title>
<meta name="theme-color" content="#070e1c" />
<meta name="description" content="Interactive replica of the W·O·R·K career-node app, running on invented demo data." />
<style>
@font-face { font-family: 'Bebas Neue'; src: url(assets/fonts/bebas-neue-latin.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url(assets/fonts/ibm-plex-mono-400-latin.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500 700; src: url(assets/fonts/ibm-plex-mono-600-latin.woff2) format('woff2'); font-display: swap; }

/* ── tokens: replicated from work-app/src/theme.js ───────────────────── */
:root {
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --bebas: 'Bebas Neue', 'IBM Plex Mono', monospace;
  --accent: #ff7a00; --accent-hi: #ffa347;
  --bgDeep: #04080f; --bgBase: #070e1c; --bgRaised: #060d1a;
  --borderFaint: rgba(120,168,210,.10); --borderMid: rgba(120,168,210,.17); --borderInput: rgba(120,168,210,.26);
  --orange: #ff7a00; --green: #00ff88; --amber: #ffcc00; --red: #ff3355; --cyan: #00d4ff; --purple: #aa66ff; --blue: #4499ff;
  --text: #eef6ff; --textMid: #c0d8f0; --textSoft: #8fb6d4; --muted: #6c93b4; --dim: #4a7192; --ghost: #2a4a6a;
  --r1: 3px; --r2: 6px; --r3: 8px; --r4: 12px;
  --lift: 0 18px 44px -22px rgba(0,0,0,.8);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow: hidden; background: var(--bgBase); }
body {
  display: flex; flex-direction: column; height: 100%; color: var(--text);
  background:
    radial-gradient(90% 115% at 100% 100%, rgba(255,122,0,.075) 0, transparent 55%),
    radial-gradient(70% 80% at 84% 2%, rgba(130,40,255,.07) 0, transparent 60%),
    radial-gradient(120% 100% at 6% 0%, rgba(0,150,255,.06) 0, transparent 55%),
    linear-gradient(162deg, #081020 0%, #05090f 55%, #03060c 100%), #070e1c;
  font-family: var(--mono); font-size: 14px; letter-spacing: .2px; overflow: hidden; -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
::selection { background: rgba(255,122,0,.28); color: #fff; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(120,168,210,.22); border-radius: 3px; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 6px currentColor; } 50% { opacity: .4; box-shadow: none; } }
@keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
.fade { animation: fadeUp .2s ease; }
.pulse-dot { animation: pulse 2.4s ease-in-out infinite; }
.marquee { display: inline-block; white-space: nowrap; animation: marquee 60s linear infinite; }
input, textarea, select {
  border-radius: var(--r2); background: rgba(4,10,20,.66); border: 1px solid var(--borderInput); color: var(--text);
  font-family: var(--mono); outline: none; transition: border-color .15s, box-shadow .15s;
}
select { -webkit-appearance: none; appearance: none; padding-right: 22px !important; background-image: linear-gradient(45deg, transparent 50%, #6c93b4 50%), linear-gradient(135deg, #6c93b4 50%, transparent 50%); background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
input::placeholder, textarea::placeholder { color: var(--dim); }
input:focus, textarea:focus, select:focus { border-color: rgba(255,122,0,.55); box-shadow: 0 0 0 1px rgba(255,122,0,.22), 0 0 26px rgba(255,122,0,.15); }
button { border-radius: var(--r2); cursor: pointer; font-family: var(--mono); color: inherit;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .12s; }
button:hover:not(:disabled) { border-color: rgba(255,122,0,.5); }
button:active:not(:disabled) { transform: translateY(1px); }
:focus-visible { outline: 2px solid rgba(255,122,0,.65); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ── shell: replicated from work-app/src/App.jsx ─────────────────────── */
.scan { position: fixed; inset: 0; pointer-events: none; z-index: 999; opacity: .45; /* App.jsx uses mix-blend-mode: overlay; dropped here — WebKit blanks unlayered content under it */
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px); }
.app { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.hdr { height: 46px; border-bottom: 1px solid var(--borderMid); background: linear-gradient(180deg, rgba(12,28,52,.62), rgba(6,14,28,.34));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 20; display: flex; align-items: center; flex-shrink: 0; }
.brand { height: 46px; border-right: 1px solid var(--borderMid); display: flex; align-items: center; gap: 9px; padding: 0 13px; flex-shrink: 0; }
.word { font-family: var(--bebas); font-size: 21px; letter-spacing: 4px; color: #fff; text-shadow: 0 0 20px rgba(255,122,0,.6), 0 0 4px rgba(255,122,0,.9); white-space: nowrap; }
.menu { background: transparent; border: none; color: var(--orange); font-size: 18px; padding: 0; line-height: 1; }
.link { display: flex; align-items: center; gap: 6px; padding: 0 14px; border-right: 1px solid var(--borderFaint); white-space: nowrap; flex-shrink: 0; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); color: var(--green); box-shadow: 0 0 6px var(--green); }
.ident { flex: 1; padding: 0 16px; font-size: 9px; color: var(--ghost); letter-spacing: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { padding: 0 14px; border-left: 1px solid var(--borderFaint); font-size: 12px; color: var(--textSoft); letter-spacing: 2px; white-space: nowrap; flex-shrink: 0; }
.body { flex: 1; display: flex; overflow: hidden; min-height: 0; position: relative; }
.nav { width: 168px; border-right: 1px solid var(--borderMid); background: linear-gradient(180deg, rgba(9,20,40,.44), rgba(5,10,20,.2));
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; transition: width .15s; }
.nav .list { padding: 8px 0; flex: 1; }
.sec { font-size: 7px; color: #3a5a7a; letter-spacing: 3px; padding: 10px 14px 4px; border-top: 1px solid rgba(120,168,210,.06); margin-top: 4px; }
.nb { width: calc(100% - 8px); height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 11px; margin: 1px 4px;
  background: transparent; border: 1px solid transparent; border-left: 2px solid transparent; color: var(--muted); font-size: 8px; letter-spacing: 2px; text-align: left; }
.nb .ic { font-size: 11px; width: 14px; text-align: center; color: var(--dim); flex-shrink: 0; }
.nb.on { background: rgba(255,122,0,.11); border-left-color: var(--orange); box-shadow: inset 0 0 20px rgba(255,122,0,.09); color: #fff; }
.nb.on .ic { color: var(--orange); text-shadow: 0 0 10px var(--orange); }
.navfoot { padding: 12px 14px; border-top: 1px solid var(--borderFaint); }
.navfoot .r { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 7px; letter-spacing: 1px; }
.navfoot .ver { margin-top: 8px; font-size: 6px; color: var(--ghost); letter-spacing: 2px; text-align: center; }
/* narrow: icon rail (App.jsx: 640 ≤ width < 1040 → 46px) */
.narrow .nav { width: 46px; }
.narrow .brand { width: 46px; padding: 0; justify-content: center; }
.narrow .word { font-size: 0; } .narrow .word::after { content: "W"; font-size: 21px; }
.narrow .nb .lbl, .narrow .sec, .narrow .navfoot { display: none; }
.narrow .nb { padding: 0; justify-content: center; }
/* mobile drawer (App.jsx: width < 640) */
.mobile .nav { position: absolute; top: 0; bottom: 0; left: 0; z-index: 50; transform: translateX(-100%); transition: transform .2s ease; background: #08111f; backdrop-filter: none; -webkit-backdrop-filter: none; }
.mobile:not(.navopen) .nav { visibility: hidden; }
.mobile.navopen .nav { transform: none; }
.backdrop { display: none; position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 40; }
.mobile.navopen .backdrop { display: block; }
.mobile .ident { display: none; } .mobile .link, .mobile .clock { padding: 0 10px; }
.mobile .brand { border-right: none; }
.content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: clip; padding: 16px; }
.mobile .content { padding: 12px; }
.ticker { height: 26px; border-top: 1px solid var(--borderMid); display: flex; background: linear-gradient(180deg, rgba(6,14,28,.5), rgba(4,9,16,.75));
  align-items: center; flex-shrink: 0; overflow: hidden; }
.ticker .tl { font-size: 8px; color: var(--orange); letter-spacing: 2px; padding: 0 12px; border-right: 1px solid var(--borderFaint); flex-shrink: 0; }
.ticker .tw { flex: 1; overflow: hidden; } .ticker .marquee { font-size: 9px; color: var(--textSoft); }
.replica { position: fixed; right: 8px; bottom: 32px; z-index: 1000; pointer-events: none; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
  color: #ffa347; background: rgba(4,8,15,.82); border: 1px solid rgba(255,122,0,.4); border-radius: 3px; padding: 3px 7px; }

/* ── primitives: replicated from work-app/src/ui.jsx ─────────────────── */
.panel { background: linear-gradient(180deg, rgba(12,26,48,.62), rgba(7,15,28,.44)); border: 1px solid var(--borderMid); border-radius: var(--r3);
  box-shadow: var(--lift); padding: 13px 15px; margin-bottom: 14px; position: relative; overflow: hidden; }
.panel > .hair { position: absolute; top: 0; left: 0; right: 0; height: 1px; opacity: .9; }
.panel .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 11px; }
.panel .pt { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; }
.pill { font-size: 8px; letter-spacing: 1.6px; padding: 2.5px 7px; border-radius: var(--r1); display: inline-block; white-space: nowrap; text-transform: uppercase; border: 1px solid; }
.btn { font-size: 9.5px; letter-spacing: 1.6px; padding: 7px 13px; border: 1px solid; white-space: nowrap; }
.btn.sm { font-size: 8px; padding: 3px 8px; }
.lab { font-size: 8px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.stat { background: rgba(4,10,20,.6); border: 1px solid var(--borderFaint); border-radius: var(--r2); padding: 11px 13px; }
.stat .v { font-size: 19px; font-weight: 600; margin-top: 5px; letter-spacing: .5px; }
.stat .s { font-size: 8px; color: var(--dim); margin-top: 3px; }
.bar { height: 5px; background: rgba(4,10,20,.8); width: 100%; border: 1px solid var(--borderFaint); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; border-radius: 99px; }
.h1 { font-family: var(--bebas); font-size: 30px; letter-spacing: 5px; color: var(--orange); line-height: 1.1; }
.sub { font-size: 10px; color: var(--muted); margin-bottom: 12px; }
.empty { font-size: 10px; color: var(--dim); padding: 10px 0; }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mobile .grid2 { grid-template-columns: 1fr; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--borderFaint); }
.row .t { font-size: 10px; color: var(--text); } .row .m { font-size: 8px; color: var(--muted); margin-top: 1px; }
.acts { display: flex; gap: 5px; margin-left: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.mobile .row { flex-wrap: wrap; } .mobile .acts { margin-left: 0; }

/* ── Jobs: replicated from work-app/src/modules/Jobs.jsx ─────────────── */
.navbtn { padding: 8px 14px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted);
  font-size: 9px; letter-spacing: 2px; border-radius: 0; white-space: nowrap; }
.subnav { display: flex; border-bottom: 1px solid var(--borderFaint); margin-bottom: 14px; overflow-x: auto; }
.heart { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; padding: 7px 10px; border: 1px solid rgba(0,255,136,.27); border-radius: 5px; background: rgba(0,255,136,.03); }
.jc { margin-bottom: 6px; border: 1px solid var(--borderFaint); border-left: 2px solid var(--borderFaint); }
.jc .top { display: flex; align-items: center; gap: 8px; padding: 7px 9px; }
.sq { width: 24px; height: 24px; flex-shrink: 0; font-size: 12px; font-family: monospace; border-radius: 0; background: transparent; }
.jc .bd { flex: 1; min-width: 0; cursor: pointer; }
.jc .ti { font-size: 10px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jc .me { font-size: 8px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jc .ex { padding: 0 9px 10px 41px; border-top: 1px solid var(--borderFaint); }
.jc .kv { display: flex; gap: 18px; flex-wrap: wrap; font-size: 8px; color: var(--muted); padding: 8px 0; }
.mapph { height: 110px; border: 1px solid var(--borderFaint); background:
  repeating-linear-gradient(0deg, rgba(120,168,210,.06) 0 1px, transparent 1px 22px),
  repeating-linear-gradient(90deg, rgba(120,168,210,.06) 0 1px, transparent 1px 22px), var(--bgRaised);
  display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--dim); position: relative; }
.mapph b { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 12px var(--orange); top: 42%; left: 48%; }
.mobile .jc .ex { padding-left: 9px; }
.mobile .jc .pills { display: none; }
.msg { font-size: 9px; padding: 7px 10px; margin-bottom: 10px; border: 1px solid; }
table { width: 100%; border-collapse: collapse; font-size: 10px; }
th { text-align: left; color: var(--dim); font-size: 8px; letter-spacing: 2px; padding: 4px 8px; border-bottom: 1px solid var(--borderFaint); font-weight: 400; }
td { padding: 5px 8px; border-bottom: 1px solid var(--borderFaint); vertical-align: middle; }
/* phone: tracker rows stack as cards so the stage buttons stay reachable */
.mobile thead { display: none; }
.mobile table, .mobile tbody, .mobile tr { display: block; }
.mobile tr { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--borderFaint); }
.mobile td { border: none; padding: 0; }
.mobile td:nth-child(2) { order: -1; flex-basis: 100%; font-size: 11px; }
.mobile td:last-child { flex-basis: 100%; }
.flow { display: flex; align-items: stretch; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.flow .st { flex: 1; min-width: 74px; padding: 7px 8px; border: 1px solid; border-radius: var(--r2); background: rgba(4,10,20,.5); }
.flow .st .n { font-size: 17px; font-weight: 600; margin-top: 2px; }
.flow .ar { align-self: center; color: var(--ghost); font-size: 10px; }
.flow .side { border-style: dashed; }
.form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.form2 input, .form2 select { font-size: 10px; padding: 6px 8px; }
.mobile .form2 { grid-template-columns: 1fr; }
textarea.draft { width: 100%; height: 220px; font-size: 11px; padding: 10px; line-height: 1.6; resize: vertical; }
.cards6 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cards6 > div { cursor: pointer; background: var(--bgDeep); padding: 7px 9px; border: 1px solid; border-left-width: 3px; }
.mobile .cards6 { grid-template-columns: 1fr; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 14px; }
.chip { border: 1px solid var(--borderFaint); border-radius: var(--r2); padding: 9px 11px; background: rgba(4,10,20,.5); }
</style>
</head>
<body>
<div class="scan"></div>
<div class="app" id="app">
  <div class="hdr">
    <div class="brand" id="brand"><button class="menu" id="menu" aria-label="menu" hidden>☰</button><span class="word">W·O·R·K</span></div>
    <div class="link"><div class="dot pulse-dot"></div><span style="font-size:8px;color:var(--dim);letter-spacing:2px">FLEET LINK</span></div>
    <div class="ident">CAREER NODE · CAREER-1 · DEMO</div>
    <div class="clock num" id="clock">--:--:-- <span style="font-size:7px;color:var(--ghost)">UTC</span></div>
  </div>
  <div class="body">
    <div class="backdrop" id="backdrop"></div>
    <nav class="nav" id="nav"></nav>
    <main class="content" id="content"></main>
  </div>
  <div class="ticker"><span class="tl">◆ SCOUT LIVE</span><div class="tw"><span class="marquee" id="tick"></span></div></div>
</div>
<div class="replica">replica · demo data</div>

<script>
(() => {
"use strict";
// ═════════════════════════ tokens + helpers ═════════════════════════
const C = { orange: "#ff7a00", green: "#00ff88", amber: "#ffcc00", red: "#ff3355", cyan: "#00d4ff", purple: "#aa66ff", blue: "#4499ff",
  gold: "#ffd166", text: "#eef6ff", textMid: "#c0d8f0", textSoft: "#8fb6d4", muted: "#6c93b4", dim: "#4a7192", ghost: "#2a4a6a", bgBase: "#070e1c" };
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STAGE_COLORS = { FOUND: C.blue, REVIEW: C.amber, APPLIED: C.orange, RESPONSE: C.purple, INTERVIEW: C.cyan, OFFER: C.green, EMPLOYED: C.green, REJECTED: C.red, SKIP: C.muted };
const STAGES = ["FOUND", "APPLIED", "RESPONSE", "INTERVIEW", "OFFER", "EMPLOYED", "REJECTED"];
const nextStage = (s) => { const i = STAGES.indexOf(s); return i >= 0 && i < 4 ? STAGES[i + 1] : null; };

const panel = (accent, title, body, right = "") => `
  <div class="panel"><div class="hair" style="background:linear-gradient(90deg,transparent,${accent},transparent);box-shadow:0 0 10px ${hexA(accent, .55)}"></div>
  ${title || right ? `<div class="ph"><div class="pt" style="color:${accent}">${title}</div>${right}</div>` : ""}${body}</div>`;
const pill = (label, color = C.muted) => `<span class="pill" style="color:${color};border-color:${hexA(color, .42)};background:${hexA(color, .08)}">${esc(label)}</span>`;
const btn = (label, color, act, { small, primary, data = "" } = {}) =>
  `<button class="btn${small ? " sm" : ""}" data-act="${act}" ${data} style="color:${primary ? "#06101f" : color};background:${primary ? color : hexA(color, .09)};border-color:${primary ? color : hexA(color, .42)};${primary ? `font-weight:600;box-shadow:0 0 18px ${hexA(color, .4)}` : ""}">${label}</button>`;
const stat = (label, value, color = C.text, sub) => `<div class="stat"><div class="lab">${label}</div>
  <div class="v num" style="color:${color};${color === C.text ? "" : `text-shadow:0 0 16px ${hexA(color, .4)}`}">${value}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
const bar = (pct, color = C.orange) => `<div class="bar"><div style="width:${Math.min(100, pct)}%;background:linear-gradient(90deg,${hexA(color, .65)},${color});box-shadow:0 0 10px ${hexA(color, .55)}"></div></div>`;
const navBtn = (on, col = C.orange) => `class="navbtn" style="${on ? `color:${col};border-bottom-color:${col};background:${col}0d` : ""}"`;
const empty = (t) => `<div class="empty">${t}</div>`;
const h1 = (t, sub) => `<div class="h1">${t}</div>${sub ? `<div class="sub">${sub}</div>` : ""}`;

// ═════════════════════════ demo data (all invented) ═════════════════════════
const L = (job_id, track, title, company, location, sector, extra = {}) =>
  ({ job_id, track, title, company, location, sector, source: "demo-feed", apply_method: track === "internship" ? "manual" : "form", is_new: false, picked: false, ...extra });
const DATA = {
  summer: [
    L("s1", "summer", "Warehouse Operative — Day Shift", "Larkfield Logistics", "Easthaven", "logistics", { is_new: true, relevance_score: 8 }),
    L("s2", "summer", "Front of House Assistant", "The Copper Kettle Group", "Kingsmere", "hospitality", { relevance_score: 7 }),
    L("s3", "summer", "Retail Sales Associate", "Brightwater Outfitters", "Easthaven", "retail", { is_new: true }),
    L("s4", "summer", "Events Steward (seasonal)", "Riverside Arena Services", "Redfern Quay", "events", { relevance_score: 6 }),
  ],
  lboro: [
    L("l1", "lboro", "Library Evening Assistant", "Millbrook College", "Vennbridge", "education", { is_new: true, relevance_score: 9 }),
    L("l2", "lboro", "Barista (part-time, 16h)", "Bean & Bramble", "Vennbridge", "hospitality", { relevance_score: 7 }),
    L("l3", "lboro", "Research Data Entry Clerk", "Halden Survey Unit", "Vennbridge", "research"),
    L("l4", "lboro", "Student Ambassador", "Old Weir Learning Trust", "Brackley Moor", "education", { is_new: true }),
  ],
  internship: [
    L("i1", "internship", "Policy Research Intern", "Northbridge Policy Institute", "Port Sallow", "thinktank", { is_new: true, relevance_score: 9, organisation: "Northbridge Policy Institute" }),
    L("i2", "internship", "Geopolitical Risk Analyst Intern", "Meridian Horizon Analytics", "Halden (EU)", "risk", { relevance_score: 8, organisation: "Meridian Horizon Analytics" }),
    L("i3", "internship", "AI Governance Research Assistant", "Lattice Commons Foundation", "Marrow Bay", "ai governance", { is_new: true, relevance_score: 9, organisation: "Lattice Commons Foundation" }),

  "cyber security": "Lead with open-source collection tooling and careful method.",
  "international affairs": "Lead with regional knowledge and long-form briefing writing.",
  journalism: "Lead with data-driven writing and fast, sourced turnaround.",
  ai: "Lead with shipped multi-agent tooling and product sense.",
};
function makeDraft(src, variant = 0) {
  const org = src.organisation || src.company || src.org, sector = src.sector || "", role = src.title || "";
  const openers = ["I'm writing to ask", "I'd like to enquire", "I'm getting in touch to ask"];
  const body = `Dear ${org} team,

I'm a final-year History and Politics undergraduate and the builder of a small AI-native intelligence toolkit. ${openers[variant % 3]} whether ${org} offers internship or work-experience opportunities${sector ? ` in ${sector}` : ""}${role && src.job_id && !src.job_id.startsWith("outreach-") ? ` — I noticed the ${role} listing` : ""} over the coming university holidays.

My focus sits at the intersection of international affairs and applied AI: I've built an open-source intelligence dashboard and a multi-agent system, and my research looks at how conflict risk can be measured. I'd welcome the chance to contribute research, analysis or communications support — in person or remote.

My interactive portfolio (with a downloadable CV) is at [portfolio link].

Thank you for your time and consideration.

Best regards,
[Your name]`;
  return { org, sector, src: src.job_id || targetId(org), variant,
    subject: "Speculative enquiry: internship / work experience",
    fit: `${org} works in ${sector || "your field"}; your research + build record maps onto its ${role ? `"${role}" opening` : "remit"}.`,
    angle: ANGLES[sector] || ANGLES.ai, cv: "internship-cv-a.pdf", cv_label: "demo CV slot", body };
}
function openDraft(id, variant = 0) {
  const src = findL(id) || S.targets.find((t) => targetId(t.org) === id);
  if (!src) return;
  S.draftPick = id; S.copied = false;
  S.draft = { org: src.organisation || src.company || src.org, loading: true };
  render();
  setTimeout(() => { S.draft = makeDraft(src, variant); render(); }, 450);
}

// ═════════════════════════ other modules — navigable shells ═════════════════════════
const today = () => new Date().toISOString().slice(0, 10);

    ["language", "✦ LANGUAGE", "Lang A B1 · Lang B A2 · 212 mastered", C.blue], ["maths", "∑ ACADEMY", "14★ · 31 proficient / 96 units", C.purple], ["lab", "⌬ LAB", "predict → play → explain", C.green]]
    .map(([t, l, v, c]) => `<div data-tab="${t}" style="border-color:${c}33;border-left-color:${c}"><div style="font-size:7.5px;color:${c};letter-spacing:1px">${l} →</div><div style="font-size:10px;color:var(--textMid);margin-top:2px">${v}</div></div>`).join("");

    <div class="grid2">
      ${panel(C.orange, "◆ Jobs — today", `<div style="font-size:11px;color:var(--textSoft);line-height:1.7">${s.awaiting ? `${s.awaiting} picked listing(s) waiting on you.` : "Queue clear."}<br>Listings today: ${DATA.summer.length} summer · ${DATA.internship.length} internship.</div>${openB("jobs", "Open Jobs →", C.orange)}`, pill("OPEN", C.orange))}
      ${panel(C.purple, "⊕ Missions", MISSIONS.slice(0, 3).map((m) => `<div class="row" style="padding:5px 0"><span style="font-size:10px;color:var(--textMid)">${m[0]}</span><span style="font-size:8px;color:var(--muted)">${m[1]}</span></div>`).join("") + openB("missions", "Open Missions →", C.purple))}
      ${panel(C.green, "⬡ Fleet", `<div style="font-size:11px;color:var(--textSoft);line-height:1.7">Canon store: <b style="color:${C.green}">LINKED</b><br>Chassis online: 4</div>${openB("fleet", "Open Fleet →", C.green)}`)}
      ${panel(C.cyan, "◇ Learning & Growth", `<div class="cards6">${tiles}</div>`, pill("SYNCED", C.cyan))}
    </div></div>`;
}
const MISSIONS = [["Conference prep — demo event", "next week"], ["Dissertation reading sprint", "ongoing"], ["Portfolio refresh", "this month"], ["Language streak · 30 days", "daily"]];
const shell = (title, sub, body) => `<div class="fade">${h1(title, sub)}${body}</div>`;
const listRows = (rows) => rows.map(([a, b, c]) => `<div class="row"><div style="flex:1;min-width:0"><div class="t">${a}</div>${b ? `<div class="m">${b}</div>` : ""}</div>${c || ""}</div>`).join("");
function discipline(name, icon, color) {
  const units = [["Foundations", 92], ["Core methods", 64], ["Applications", 38], ["Extension", 12]];
  return shell(`${icon} ${name}`, "Mastery-gated units · demo progress",
    `<div class="grid-stats">${stat("Mastered", 14, C.green)}${stat("Proficient", 31, C.amber)}${stat("Units", 96)}${stat("Active days / 7", 5, C.warm || C.orange)}</div>` +
    panel(color, "◇ Units", units.map(([u, p]) => `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px"><span>${u}</span><span class="num" style="color:var(--muted)">${p}%</span></div>${bar(p, color)}</div>`).join("")));
}
const VIEWS = {
  home: viewHome, jobs: viewJobs,
  routine: () => shell("ROUTINE", "Day plan · demo", panel(C.orange, "◷ Today", listRows([["07:30 · Wake + review", "brief", pill("DONE", C.green)], ["09:00 · Deep work block", "dissertation", pill("NOW", C.orange)], ["13:00 · Language drill", "15 min", pill("NEXT", C.muted)], ["18:00 · Shift", "part-time role", pill("LATER", C.muted)]]))),
  cvs: () => shell("CVS", "Role-tailored CV slots · demo — no files are included in this replica",
    panel(C.green, "▣ Summer CV", `<div style="font-size:10px;color:var(--textSoft);margin-bottom:8px">Local / retail / hospitality. Outcome-focused, delivers-under-pressure framing.</div><div style="font-size:10px;color:var(--dim)">summer-cv.pdf · demo placeholder</div>`, pill("ON FILE", C.green)) +
    panel(C.cyan, "▣ Internship CV", `<div style="font-size:10px;color:var(--textSoft);margin-bottom:8px">Founder + academic + international-affairs angle front and centre.</div><div style="font-size:10px;color:var(--dim)">internship-cv-a.pdf · demo placeholder</div>`, pill("ON FILE", C.green)) +
    panel(C.orange, "🔒 CV library — correct job → correct CV", listRows([["Summer · retail / hospitality", "", `<span style="font-size:9px;color:${C.green}">cv-summer-a.pdf ✓</span>`], ["Term-time · campus roles", "", `<span style="font-size:9px;color:${C.green}">cv-term-a.pdf ✓</span>`], ["§A · research / policy", "", `<span style="font-size:9px;color:${C.green}">internship-cv-a.pdf ✓</span>`], ["§B · data / AI", "", `<span style="font-size:9px;color:${C.red}">internship-cv-b.pdf ✗</span>`]]))),
  career: () => shell("▲ CAREER", "Skills ladder + applications · demo", `<div class="grid-stats">${stat("Applications", S.tracker.length, C.orange)}${stat("Interviews", S.tracker.filter((a) => a.stage === "INTERVIEW").length, C.cyan)}${stat("Avg skill", "58%", C.amber)}</div>` +
    panel(C.amber, "◎ Skills", [["Research & analysis", 74], ["Python / data", 61], ["Writing & briefing", 70], ["Public speaking", 42]].map(([k, p]) => `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px"><span>${k}</span><span class="num" style="color:var(--muted)">${p}%</span></div>${bar(p, C.amber)}</div>`).join(""))),
  skills: () => shell("◇ SKILLS", "XP by discipline · demo", panel(C.purple, "◇ XP", listRows([["Analysis", "1,640 XP", pill("LV 7", C.purple)], ["Engineering", "1,410 XP", pill("LV 6", C.purple)], ["Languages", "980 XP", pill("LV 5", C.purple)], ["Communication", "790 XP", pill("LV 4", C.purple)]]))),
  language: () => shell("LANGUAGE", "Spaced repetition + speaking drills · demo", `<div class="grid-stats">${stat("Said from memory", 212, C.green)}${stat("Median latency", "1.8s", C.amber)}${stat("Days / 7", 6, C.orange)}</div>` +
    panel(C.blue, "✦ Today's drill", listRows([["Ordering at a café", "12 phrases", pill("FAMILIAR", C.amber)], ["Directions + transport", "9 phrases", pill("MASTERED", C.green)], ["Small talk · weather", "14 phrases", pill("NEW", C.muted)]]))),
  reading: () => shell("READ", "Book library · demo", `<div class="grid-stats">${stat("Openable", 18)}${stat("Reading", 3, C.orange)}${stat("Pages read", 1240, C.green)}${stat("Notes", 86, C.purple)}</div>` +
    panel(C.orange, "▤ On the desk", listRows([["The Craft of Strategy", "p. 142 / 380", bar(37)], ["Data, Plainly", "p. 88 / 240", bar(36, C.cyan)], ["A Short History of Treaties", "p. 20 / 310", bar(6, C.purple)]]))),
  lecture: () => shell("LECTURE", "Record · transcribe · capture · demo", panel(C.orange, "◫ This week", listRows([["Seminar 4 · Theories of order", "Tue 10:00 · Room B2", pill("NOTES", C.green)], ["Lecture 5 · Methods", "Wed 14:00 · Hall 1", pill("NEXT", C.orange)]]))),
  maths: () => discipline("MATHS", "∑", C.purple), physics: () => discipline("PHYSICS", "⚛", C.cyan), econ: () => discipline("ECONOMICS", "⇄", C.amber),
  lab: () => shell("⌬ THE LAB", "Predict → play → explain · demo", panel(C.green, "⌬ Experiments", listRows([["Pendulum period vs length", "predict first", pill("OPEN", C.green)], ["Supply shock on a simple market", "slider sim", pill("OPEN", C.green)], ["Random walk + drift", "Monte Carlo", pill("DONE", C.muted)]]))),
  cad: () => shell("C·A·D", "Parametric sketches · demo", panel(C.orange, "⬢ Parts", `<svg viewBox="0 0 320 120" style="width:100%;max-width:420px;height:auto;display:block"><g fill="none" stroke="${C.orange}" stroke-width="1.2"><rect x="20" y="20" width="120" height="80" rx="6"/><circle cx="80" cy="60" r="18"/><path d="M180 100 L230 20 L280 100 Z"/></g><g fill="${C.dim}" font-size="8" font-family="IBM Plex Mono"><text x="20" y="114">bracket · 120×80</text><text x="190" y="114">gusset · 100×80</text></g></svg>`)),
  vault: () => shell("VAULT", "Second brain · search · demo index", `<input placeholder="Search the demo notes…" style="width:100%;font-size:10px;padding:7px 10px;margin-bottom:12px">` +
    panel(C.orange, "⌕ Recent notes", listRows([["reading-notes-template.md", "evergreen · demo", pill("HUMAN", C.green)], ["research-method-checklist.md", "evergreen · demo", pill("HUMAN", C.green)], ["weekly-review.md", "dated · demo", pill("AGENT", C.muted)]]))),
  intel: () => shell("INTEL", "Live scout feed · agent reports · demo", panel(C.orange, "◆ Live scout feed", listRows(TICK.map((t, i) => [t, `${i * 7 + 3}m ago`, ""]))) + panel(C.cyan, "⬡ Agent reports (24h)", listRows([["scout · job stream", "6 new listings", pill("OK", C.green)], ["scout · intel stream", "14 items", pill("OK", C.green)]]))),
  missions: () => shell("MISSIONS", "Mission engine · demo missions", panel(C.purple, "⊕ Active", listRows(MISSIONS.map(([t, w]) => [t, w, pill("ACTIVE", C.purple)])))),
  fleet: () => shell("FLEET", "Machine chassis · details redacted in replica",
    `<div class="chips">${[["THIS NODE", "workstation"], ["CANON", "storage node"], ["SCOUT", "scan engine"], ["EDGE", "remote VPS"]].map(([k, n]) => `<div class="chip"><div class="lab" style="color:var(--dim)">${k}</div><div style="font-size:11px;margin-top:4px;color:var(--text)">${n}</div><div style="font-size:8px;color:${C.green};margin-top:3px">● online · redacted</div></div>`).join("")}</div>` +
    panel(C.orange, "⬡ Chassis", listRows([["Job scanner", "every 30m", pill("RUNNING", C.green)], ["Night shift", "scheduled", pill("IDLE", C.muted)], ["Backup", "nightly", pill("OK", C.green)]]))),
  aieng: () => shell("AI ACADEMY", "AI-engineer curriculum · demo", panel(C.cyan, "△ Stages", listRows([["Stage 1 · Prompting + evals", "6 / 6 skills", pill("DONE", C.green)], ["Stage 2 · Tools + agents", "3 / 7 skills", pill("ACTIVE", C.cyan)], ["Stage 3 · Retrieval", "0 / 5 skills", pill("LOCKED", C.muted)]]))),
  security: () => shell("SENTINEL", "Fleet defence · demo telemetry", `<div class="grid-stats">${stat("Honeypot", "ARMED", C.green)}${stat("Intrusions", 0, C.green)}${stat("Evidence chain", "INTACT", C.green)}${stat("Logged events", 1284)}</div>` +
    panel(C.red, "◎ Access log — most recent", listRows([["baseline diff · no change", "demo node", pill("OK", C.green)], ["login · expected user", "demo node", pill("OK", C.green)], ["port scan · blocked", "edge", pill("BLOCKED", C.amber)]]))),
};

// ═════════════════════════ render + events ═════════════════════════
const app = document.getElementById("app"), content = document.getElementById("content");
function layout() {
  const w = window.innerWidth;
  app.classList.toggle("mobile", w < 640);
  app.classList.toggle("narrow", w >= 640 && w < 1040);
  document.getElementById("menu").hidden = w >= 640;
  if (w >= 640) S.navOpen = false;
  app.classList.toggle("navopen", S.navOpen);
}
function render(keepScroll = true) {
  const y = content.scrollTop;
  renderNav();
  content.innerHTML = (VIEWS[S.tab] || viewHome)();
  if (keepScroll) { content.scrollTop = y; const f = content.firstElementChild; if (f) f.classList.remove("fade"); }
  const q = document.getElementById("jobq");
  if (q) q.addEventListener("input", (e) => { S.q = e.target.value; const r = jobsListHTML(); document.getElementById("joblist").innerHTML = r.html; document.getElementById("jobcount").textContent = r.count; });
  const sel = document.getElementById("draftsel");
  if (sel) sel.addEventListener("change", (e) => { S.draftPick = e.target.value; });
  const tb = document.getElementById("draftbody");
  if (tb) tb.addEventListener("input", (e) => { S.draft.body = e.target.value; });
}
const val = (id) => (document.getElementById(id) || {}).value || "";
const pickedOf = (track) => DATA[track].filter((l) => l.picked && !trackedIds().has(l.job_id));
const addTracker = (l, source) => S.tracker.push({ job_id: l.job_id, title: l.title, company: l.organisation || l.company, track: l.track, source: source || l.source, stage: "APPLIED", applied_at: today() });

const ACTIONS = {
  sub: (d) => { S.sub = d.id; S.msg = ""; },
  track: (d) => { S.track = d.id; S.view = "triage"; S.msg = ""; S.q = ""; },
  view: (d) => { S.view = d.id; },
  pick: (d) => { const l = findL(d.id); l.picked = !l.picked; l.is_new = false; },
  dismiss: (d) => { for (const t of Object.keys(DATA)) DATA[t] = DATA[t].filter((x) => x.job_id !== d.id); open.delete(d.id); },
  expand: (d) => { open.has(d.id) ? open.delete(d.id) : open.add(d.id); },
  applying: () => { S.applying = !S.applying; S.msg = S.applying ? "✓ Applying ACTIVATED — MASS-APPLY will run the bot on your YES list (demo: logs them to the TRACKER)." : "Applying deactivated."; },
  mass: () => {
    const chosen = pickedOf(S.track);
    if (!chosen.length) { S.msg = "Tick the jobs you want (✓) first — they land in your YES list."; return; }
    if (!S.applying) { S.msg = "⚠ Applying is OFF. Flip APPLYING: ON to let the bot apply to your YES list."; return; }
    chosen.forEach((l) => addTracker(l)); S.msg = `✓ ${chosen.length} application(s) logged → TRACKER at stage APPLIED. (Replica — nothing was submitted.)`;
  },
  scan: () => { S.scanMsg = "scout scanning…"; setTimeout(() => { S.scanMsg = "✓ no new demo listings"; render(); setTimeout(() => { S.scanMsg = ""; render(); }, 1800); }, 1200); },
  reset: () => { location.reload(); },
  advance: (d) => { const a = S.tracker.find((x) => x.job_id === d.id); if (a) a.stage = d.stage; },
  roleForm: () => { S.rolesOpen = !S.rolesOpen; },
  roleSave: () => { const r = { id: "r" + Date.now(), employer: val("rf-employer"), role: val("rf-role"), type: val("rf-type"), pay: val("rf-pay"), hours: val("rf-hours"), started: val("rf-started"), notes: val("rf-notes"), status: "EMPLOYED" };
    if (!r.employer && !r.role) return; S.roles.push(r); S.rolesOpen = false; },
  roleEnd: (d) => { const r = S.roles.find((x) => x.id === d.id); r.status = "ENDED"; r.ended = today(); },
  roleOn: (d) => { const r = S.roles.find((x) => x.id === d.id); r.status = "EMPLOYED"; r.ended = ""; },
  roleDel: (d) => { S.roles = S.roles.filter((x) => x.id !== d.id); },
  draftSel: () => { const id = val("draftsel"); if (id) { openDraft(id); return "skip"; } },
  draftFor: (d) => { openDraft(d.id); return "skip"; },
  redraft: () => { openDraft(S.draft.src, (S.draft.variant || 0) + 1); return "skip"; },
  closeDraft: () => { S.draft = null; },
  copy: () => { try { navigator.clipboard && navigator.clipboard.writeText(S.draft.body).catch(() => {}); } catch (e) {} S.copied = true; },
  applied: (d) => { const l = findL(d.id); if (l) addTracker(l, "outreach"); },
  appliedT: (d) => { const t = S.targets.find((x) => targetId(x.org) === d.id); S.tracker.push({ job_id: d.id, title: t.org, company: t.org, track: "internship", source: "outreach", stage: "APPLIED", applied_at: today() }); },
};

document.addEventListener("click", (e) => {
  const tabEl = e.target.closest("[data-tab]");
  if (tabEl) { S.tab = tabEl.dataset.tab; S.navOpen = false; layout(); render(false); content.scrollTop = 0; return; }
  const el = e.target.closest("[data-act]");
  if (!el || !ACTIONS[el.dataset.act]) return;
  if (ACTIONS[el.dataset.act](el.dataset) !== "skip") render();
});
document.getElementById("menu").addEventListener("click", () => { S.navOpen = !S.navOpen; layout(); });
document.getElementById("backdrop").addEventListener("click", () => { S.navOpen = false; layout(); });
window.addEventListener("resize", () => { layout(); });

const TICK = ["six new demo listings across three tracks", "policy research feed refreshed", "language streak held", "night shift idle", "sentinel baseline unchanged", "reading queue: two items assessed"];
document.getElementById("tick").textContent = TICK.join("   ◆   ");
const clk = document.getElementById("clock");
const tickClock = () => { clk.firstChild.textContent = new Date().toUTCString().split(" ")[4] + " "; };
tickClock(); setInterval(tickClock, 1000);

layout(); render();
})();
</script>
